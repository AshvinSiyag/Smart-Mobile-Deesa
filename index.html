<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scanner - Flight Search Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const FlightPortal = () => {
            const [tripType, setTripType] = useState('round-trip');
            const [from, setFrom] = useState('');
            const [to, setTo] = useState('');
            const [departDate, setDepartDate] = useState('');
            const [returnDate, setReturnDate] = useState('');
            const [passengers, setPassengers] = useState(1);
            const [cabin, setCabin] = useState('economy');
            const [searchResults, setSearchResults] = useState(null);
            const [sortBy, setSortBy] = useState('price');
            const [showFilters, setShowFilters] = useState(false);
            const [filters, setFilters] = useState({
                maxPrice: 100000,
                airlines: [],
                stops: 'all'
            });
            const [airports, setAirports] = useState([]);
            const [airportSearchFrom, setAirportSearchFrom] = useState('');
            const [airportSearchTo, setAirportSearchTo] = useState('');

            React.useEffect(() => {
                fetch('https://raw.githubusercontent.com/mwgg/Airports/master/airports.json')
                    .then(r => r.json())
                    .then(data => setAirports(Object.values(data)
                        .filter(a => a.iata && a.name && a.city && a.country)
                        .map(a => ({code:a.iata,name:a.name,city:a.city,country:a.country}))
                        .sort((a,b) => `${a.city} ${a.name}`.localeCompare(`${b.city} ${b.name}`))))
                    .catch(() => setAirports([
                        {code:'DEL',name:'Indira Gandhi International Airport',city:'Delhi',country:'India'},
                        {code:'BOM',name:'Chhatrapati Shivaji Maharaj International Airport',city:'Mumbai',country:'India'},
                        {code:'BLR',name:'Kempegowda International Airport',city:'Bengaluru',country:'India'},
                        {code:'HYD',name:'Rajiv Gandhi International Airport',city:'Hyderabad',country:'India'}
                    ]));
            }, []);

            const airportMatches = q => {
                q=q.trim().toLowerCase();
                return (q ? airports.filter(a => [a.code,a.name,a.city,a.country].some(x=>x.toLowerCase().includes(q))) : airports).slice(0,30);
            };

            const bookingSites = [
                {name:'Google Flights',url:'https://www.google.com/travel/flights'},
                {name:'Skyscanner',url:'https://www.skyscanner.net/'},
                {name:'KAYAK',url:'https://www.kayak.com/flights'},
                {name:'Wego',url:'https://www.wego.com/flights'},
                {name:'Expedia',url:'https://www.expedia.com/Flights'},
                {name:'Kiwi.com',url:'https://www.kiwi.com/en/search'}
            ];

            const makeSearchUrl = (site, f) => {
                const fromCode=f.from, toCode=f.to, d=f.departDate, r=f.returnDate||'';
                if(site.name==='Google Flights') return `https://www.google.com/travel/flights?hl=en#flt=${fromCode}.${toCode}.${d}*${toCode}.${fromCode}.${r}`;
                if(site.name==='Skyscanner') return `https://www.skyscanner.net/transport/flights/${fromCode.toLowerCase()}/${toCode.toLowerCase()}/${d.replaceAll('-','')}/`;
                if(site.name==='KAYAK') return `https://www.kayak.com/flights/${fromCode}-${toCode}/${d}${r?'/'+r:''}/${f.passengers}adults`;
                if(site.name==='Wego') return `https://www.wego.com/flights/search?search=${fromCode}-${toCode}-${d}`;
                if(site.name==='Expedia') return `https://www.expedia.com/Flights-Search?flight-type=${f.tripType==='one-way'?'on':'roundtrip'}&from=${fromCode}&to=${toCode}&departure=${d}${r?'&return='+r:''}&passengers=${f.passengers}`;
                return `https://www.kiwi.com/en/search/results/${fromCode}/${toCode}/${d}/${r||d}/`;
            };

            const generateFlights = () => Array.from({length:12},(_,i)=>({
                id:i, airline:['Air India','IndiGo','Emirates','Qatar Airways','Singapore Airlines','Lufthansa','British Airways'][Math.floor(Math.random()*7)],
                departure:`${String(Math.floor(Math.random()*24)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`,
                arrival:`${String(Math.floor(Math.random()*24)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`,
                duration:`${Math.floor(Math.random()*10)+2}h ${Math.floor(Math.random()*60)}m`,
                stops:Math.floor(Math.random()*3), price:Math.floor(Math.random()*25000)+5000,
                rating:(Math.random()*2+3).toFixed(1), from,to,departDate,returnDate,passengers,cabin,tripType
            }));
            const handleSearch = e => {
                e.preventDefault();
                if(!from || !to || !departDate || (tripType!=='one-way' && !returnDate))
                    return alert('Please select From, To and the required travel dates.');
                if(from===to) return alert('From and To airports cannot be the same.');
                setSearchResults(generateFlights());
                setShowFilters(false);
            };

            const filteredFlights = useMemo(() => {
                if (!searchResults) return [];
                
                return searchResults
                    .filter(flight => flight.price <= filters.maxPrice)
                    .filter(flight => filters.airlines.length === 0 || filters.airlines.includes(flight.airline))
                    .filter(flight => {
                        if (filters.stops === 'direct') return flight.stops === 0;
                        if (filters.stops === 'one') return flight.stops <= 1;
                        return true;
                    })
                    .sort((a, b) => {
                        if (sortBy === 'price') return a.price - b.price;
                        if (sortBy === 'duration') return parseInt(a.duration) - parseInt(b.duration);
                        if (sortBy === 'rating') return parseFloat(b.rating) - parseFloat(a.rating);
                        return 0;
                    });
            }, [searchResults, sortBy, filters]);

            const fromAirport = airports.find(a => a.code === from);
            const toAirport = airports.find(a => a.code === to);

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
                    {/* Header */}
                    <header className="bg-white shadow-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img src="./logo.png" alt="Smart Scanner" className="h-10 w-10 object-contain rounded-lg" onError={(e)=>e.currentTarget.style.display='none'} />
                                <div className="text-2xl font-bold text-indigo-600">Smart Scanner</div>
                            </div>
                            <nav className="flex gap-6 text-sm font-medium">
                                <button className="text-gray-700 hover:text-indigo-600">Flights</button>
                                <button className="text-gray-700 hover:text-indigo-600">Hotels</button>
                                <button className="text-gray-700 hover:text-indigo-600">Trips</button>
                            </nav>
                        </div>
                    </header>

                    {/* Search Section */}
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-12">
                        <div className="max-w-7xl mx-auto px-4">
                            <h1 className="text-4xl font-bold mb-8">Smart Scanner — Find & Compare Flights</h1>

                            <form onSubmit={handleSearch} className="bg-white text-gray-800 rounded-lg p-6 shadow-lg">
                                {/* Trip Type */}
                                <div className="flex gap-6 mb-6 flex-wrap">
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" value="one-way" checked={tripType === 'one-way'} onChange={(e) => setTripType(e.target.value)} />
                                        <span className="font-medium">One-way</span>
                                    </label>
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" value="round-trip" checked={tripType === 'round-trip'} onChange={(e) => setTripType(e.target.value)} />
                                        <span className="font-medium">Round-trip</span>
                                    </label>
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" value="multi-city" checked={tripType === 'multi-city'} onChange={(e) => setTripType(e.target.value)} />
                                        <span className="font-medium">Multi-city</span>
                                    </label>
                                </div>

                                {/* Search Fields */}
                                <div className="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
                                    {/* From */}
                                    <div>
                                        <label className="block text-sm font-semibold mb-2">From</label>
                                        <div className="relative">
                                            <input value={airportSearchFrom || (airports.find(a=>a.code===from)?.code || '')} onChange={e=>{setAirportSearchFrom(e.target.value);setFrom('')}} placeholder="Search airport, city or IATA" className="w-full border-2 border-gray-300 rounded px-4 py-3" autoComplete="off"/>
                                            {airportSearchFrom && <div className="absolute z-50 w-full bg-white border rounded-lg shadow-xl max-h-64 overflow-auto">
                                                {airportMatches(airportSearchFrom).map(a=><button type="button" key={a.code+a.name} onClick={()=>{setFrom(a.code);setAirportSearchFrom('')}} className="w-full text-left px-4 py-3 hover:bg-indigo-50 border-b"><b>{a.code}</b> — {a.name}<div className="text-xs text-gray-500">{a.city}, {a.country}</div></button>)}
                                            </div>}
                                        </div>
                                    </div>

                                    {/* To */}
                                    <div>
                                        <label className="block text-sm font-semibold mb-2">To</label>
                                        <div className="relative">
                                            <input value={airportSearchTo || (airports.find(a=>a.code===to)?.code || '')} onChange={e=>{setAirportSearchTo(e.target.value);setTo('')}} placeholder="Search airport, city or IATA" className="w-full border-2 border-gray-300 rounded px-4 py-3" autoComplete="off"/>
                                            {airportSearchTo && <div className="absolute z-50 w-full bg-white border rounded-lg shadow-xl max-h-64 overflow-auto">
                                                {airportMatches(airportSearchTo).map(a=><button type="button" key={a.code+a.name} onClick={()=>{setTo(a.code);setAirportSearchTo('')}} className="w-full text-left px-4 py-3 hover:bg-indigo-50 border-b"><b>{a.code}</b> — {a.name}<div className="text-xs text-gray-500">{a.city}, {a.country}</div></button>)}
                                            </div>}
                                        </div>
                                    </div>

                                    {/* Depart Date */}
                                    <div>
                                        <label className="block text-sm font-semibold mb-2">Depart</label>
                                        <input type="date" value={departDate} onChange={(e) => setDepartDate(e.target.value)} className="w-full border-2 border-gray-300 rounded px-4 py-3 focus:outline-none focus:border-indigo-500" />
                                    </div>

                                    {/* Return Date */}
                                    {tripType !== 'one-way' && (
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Return</label>
                                            <input type="date" value={returnDate} onChange={(e) => setReturnDate(e.target.value)} className="w-full border-2 border-gray-300 rounded px-4 py-3 focus:outline-none focus:border-indigo-500" />
                                        </div>
                                    )}

                                    {/* Passengers */}
                                    <div>
                                        <label className="block text-sm font-semibold mb-2">Passengers</label>
                                        <select value={passengers} onChange={(e) => setPassengers(e.target.value)} className="w-full border-2 border-gray-300 rounded px-4 py-3 focus:outline-none focus:border-indigo-500">
                                            {[1, 2, 3, 4, 5, 6].map(n => <option key={n} value={n}>{n} {n == 1 ? 'Passenger' : 'Passengers'}</option>)}
                                        </select>
                                    </div>
                                </div>

                                {/* Cabin Selection */}
                                <div className="flex gap-4 mb-6 flex-wrap">
                                    {['economy', 'premium', 'business', 'first'].map(c => (
                                        <label key={c} className="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" value={c} checked={cabin === c} onChange={(e) => setCabin(e.target.value)} />
                                            <span className="capitalize font-medium">{c}</span>
                                        </label>
                                    ))}
                                </div>

                                {/* Search Button */}
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
                                    🔍 Search Flights
                                </button>
                            </form>
                        </div>
                    </div>

                    {/* Results Section */}
                    <div className="max-w-7xl mx-auto px-4 py-12">
                        {searchResults && (
                            <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                                {/* Sidebar Filters */}
                                <div className="lg:col-span-1">
                                    <button onClick={() => setShowFilters(!showFilters)} className="w-full bg-white border-2 border-gray-300 rounded p-3 font-semibold text-indigo-600 mb-4 lg:hidden">
                                        {showFilters ? '❌ Hide Filters' : '⚙️ Show Filters'}
                                    </button>

                                    {(showFilters || window.innerWidth >= 1024) && (
                                        <div className="bg-white rounded-lg shadow-md p-6">
                                            <h3 className="text-lg font-bold mb-4">🔍 Filters</h3>

                                            {/* Price Filter */}
                                            <div className="mb-6">
                                                <label className="block font-semibold mb-2">Max Price: ₹{filters.maxPrice}</label>
                                                <input type="range" min="5000" max="100000" value={filters.maxPrice} onChange={(e) => setFilters({...filters, maxPrice: parseInt(e.target.value)})} className="w-full cursor-pointer" />
                                            </div>

                                            {/* Stops Filter */}
                                            <div className="mb-6">
                                                <label className="block font-semibold mb-2">Stops</label>
                                                <select value={filters.stops} onChange={(e) => setFilters({...filters, stops: e.target.value})} className="w-full border border-gray-300 rounded px-3 py-2">
                                                    <option value="all">All Stops</option>
                                                    <option value="direct">Direct Flights Only</option>
                                                    <option value="one">One Stop or Less</option>
                                                </select>
                                            </div>

                                            {/* Airlines */}
                                            <div>
                                                <label className="block font-semibold mb-2">Airlines</label>
                                                {['Air India', 'IndiGo', 'Spice Jet'].map(airline => (
                                                    <label key={airline} className="flex items-center gap-2 mb-2 cursor-pointer">
                                                        <input type="checkbox" checked={filters.airlines.includes(airline)} onChange={(e) => {
                                                            if (e.target.checked) {
                                                                setFilters({...filters, airlines: [...filters.airlines, airline]});
                                                            } else {
                                                                setFilters({...filters, airlines: filters.airlines.filter(a => a !== airline)});
                                                            }
                                                        }} />
                                                        <span>{airline}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Flight Results */}
                                <div className="lg:col-span-3">
                                    <div className="flex justify-between items-center mb-6 flex-wrap gap-2">
                                        <h2 className="text-2xl font-bold">
                                            {fromAirport?.code} ✈️ {toAirport?.code} ({filteredFlights.length} results)
                                        </h2>
                                        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="border-2 border-gray-300 rounded px-4 py-2 font-medium">
                                            <option value="price">💰 Lowest Price</option>
                                            <option value="duration">⏱️ Shortest Duration</option>
                                            <option value="rating">⭐ Best Rating</option>
                                        </select>
                                    </div>

                                    <div className="bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-xl p-5 mb-6 shadow-lg">
                                        <h3 className="text-xl font-bold">💰 Cheapest Flights — Compare Websites</h3>
                                        <p className="text-indigo-100 text-sm mb-4">Open the same route and dates on multiple flight-search websites.</p>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                            {bookingSites.map(site => <a key={site.name} href={makeSearchUrl(site, filteredFlights[0] || {from,to,departDate,returnDate,passengers,cabin,tripType})} target="_blank" rel="noopener noreferrer" className="bg-white text-indigo-700 font-bold px-3 py-3 rounded-lg text-center hover:bg-indigo-50">{site.name} ↗</a>)}
                                        </div>
                                    </div>

                                    {filteredFlights.length === 0 ? (
                                        <div className="bg-white rounded-lg shadow p-8 text-center">
                                            <p className="text-gray-500 text-lg">❌ No flights found. Try adjusting your filters.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            {filteredFlights.map(flight => (
                                                <div key={flight.id} className="bg-white rounded-lg shadow hover:shadow-lg transition p-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-4 flex-wrap">
                                                            <div className="font-bold text-lg text-indigo-600">{flight.airline}</div>
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-2xl font-bold">{flight.departure}</span>
                                                                <span>➜</span>
                                                                <span className="text-2xl font-bold">{flight.arrival}</span>
                                                            </div>
                                                        </div>
                                                        <div className="text-sm text-gray-600 mt-2">
                                                            ⏱️ {flight.duration} • {flight.stops === 0 ? '✅ Direct' : `🔄 ${flight.stops} Stop(s)`}
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-6 flex-wrap">
                                                        <div className="text-right">
                                                            <div className="text-sm text-gray-600">Rating</div>
                                                            <div className="text-xl font-bold text-yellow-500">⭐ {flight.rating}</div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="text-sm text-gray-600">From</div>
                                                            <div className="text-3xl font-bold text-indigo-600">₹{flight.price.toLocaleString()}</div>
                                                        </div>
                                                        <button className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition whitespace-nowrap">
                                                            ✔️ Select
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {!searchResults && (
                            <div className="text-center py-20">
                                <p className="text-gray-600 text-xl">🔍 Search for flights above to get started</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<FlightPortal />, document.getElementById('root'));
    </script>
</body>
</html>
