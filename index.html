<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Scanner - Flight Search</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
.header{background:#fff;border-bottom:1px solid #e8ebf2;position:sticky;top:0;z-index:100}
.nav{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:800;color:#3157d5}
.brand img{width:42px;height:42px;object-fit:contain;border-radius:9px}
.hero{background:linear-gradient(135deg,#2463eb,#5437c9);padding:48px 20px 70px;color:#fff}
.wrap{max-width:1200px;margin:auto}.hero h1{font-size:38px;margin:0 0 25px}
.searchbox{background:#fff;color:#172033;border-radius:18px;padding:20px;box-shadow:0 16px 40px #101b4a33}
.radios{display:flex;gap:22px;margin-bottom:18px}.radios label{cursor:pointer}
.grid{display:grid;grid-template-columns:1.5fr 1.5fr 1fr 1fr 1fr;gap:12px}
.field label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}.field input,.field select{width:100%;height:48px;border:1px solid #d9deea;border-radius:10px;padding:0 13px;font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:#3157d5;box-shadow:0 0 0 3px #3157d51a}
.searchbtn{width:100%;height:50px;border:0;border-radius:11px;background:#3157d5;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:14px}
.searchbtn:hover{background:#2546b5}.hint{font-size:12px;color:#687386;margin-top:6px}
.results{max-width:1200px;margin:auto;padding:35px 20px 60px}
.compare{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 7px 25px #1a2b4a0e}
.compare h2{margin:0 0 5px}.muted{color:#687386;font-size:13px}
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.site{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#172033;border:1px solid #e1e5ee;border-radius:12px;padding:15px;background:#fff}
.site:hover{border-color:#3157d5;background:#f6f8ff}.site b{display:block}.site span{font-size:12px;color:#687386}.go{color:#3157d5;font-weight:800}
.cards{display:grid;gap:12px}.card{background:#fff;border-radius:15px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 6px 22px #1a2b4a0b}
.airline{font-weight:800;color:#3157d5}.times{font-size:23px;font-weight:800;margin-top:6px}.meta{font-size:13px;color:#687386;margin-top:7px}.price{font-size:24px;font-weight:900;color:#3157d5}.book{display:inline-block;text-decoration:none;background:#3157d5;color:#fff;padding:11px 16px;border-radius:9px;font-weight:800;margin-top:7px}
.empty{background:#fff;padding:35px;text-align:center;border-radius:15px;color:#687386}
.dropdown{position:relative}.suggestions{position:absolute;left:0;right:0;top:76px;background:#fff;border:1px solid #dce1eb;border-radius:11px;box-shadow:0 15px 35px #17203326;max-height:300px;overflow:auto;z-index:300}
.sug{width:100%;border:0;background:#fff;text-align:left;padding:12px 13px;cursor:pointer;border-bottom:1px solid #edf0f5}.sug:hover{background:#f2f5ff}.sug b{color:#3157d5}.sug small{display:block;color:#687386;margin-top:3px}
.status{font-size:13px;color:#687386;margin-top:12px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.sites{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.hero h1{font-size:29px}.grid,.sites{grid-template-columns:1fr}.card{align-items:flex-start;flex-direction:column}.nav{padding:12px 15px}}
</style>
</head>
<body>
<header class="header"><div class="nav">
<div class="brand"><img src="logo.png" alt="Smart Scanner" onerror="this.style.display='none'"><span>Smart Scanner</span></div>
</div></header>

<section class="hero"><div class="wrap">
<h1>Find & Compare Cheap Flights</h1>
<form id="searchForm" class="searchbox">
<div class="radios">
<label><input type="radio" name="trip" value="oneway"> One-way</label>
<label><input type="radio" name="trip" value="round" checked> Round-trip</label>
</div>
<div class="grid">
<div class="field dropdown">
<label>From</label>
<input id="fromInput" placeholder="City, airport or IATA" autocomplete="off">
<div id="fromSug" class="suggestions" hidden></div>
</div>
<div class="field dropdown">
<label>To</label>
<input id="toInput" placeholder="City, airport or IATA" autocomplete="off">
<div id="toSug" class="suggestions" hidden></div>
</div>
<div class="field"><label>Depart</label><input id="depart" type="date"></div>
<div class="field" id="returnWrap"><label>Return</label><input id="return" type="date"></div>
<div class="field"><label>Passengers</label><select id="passengers"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></div>
</div>
<div style="display:flex;gap:18px;margin-top:14px;flex-wrap:wrap">
<label><input type="radio" name="cabin" value="economy" checked> Economy</label>
<label><input type="radio" name="cabin" value="premium"> Premium Economy</label>
<label><input type="radio" name="cabin" value="business"> Business</label>
<label><input type="radio" name="cabin" value="first"> First</label>
</div>
<button class="searchbtn" type="submit">🔎 Search Flights</button>
<div id="status" class="status">Loading worldwide airport database…</div>
</form>
</div></section>

<main class="results" id="results">
<div class="empty">Search for a route above. You can search thousands of airports by airport name, city, country or IATA code.</div>
</main>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let airports=[], fromAirport=null,toAirport=null, selectedFrom=false,selectedTo=false;

const fallback=[
["DEL","Indira Gandhi International Airport","Delhi","India"],["BOM","Chhatrapati Shivaji Maharaj International Airport","Mumbai","India"],["BLR","Kempegowda International Airport","Bengaluru","India"],["HYD","Rajiv Gandhi International Airport","Hyderabad","India"],["CCU","Netaji Subhas Chandra Bose International Airport","Kolkata","India"],["MAA","Chennai International Airport","Chennai","India"],["AMD","Sardar Vallabhbhai Patel International Airport","Ahmedabad","India"],["GOI","Manohar International Airport","Goa","India"],["JFK","John F. Kennedy International Airport","New York","United States"],["LAX","Los Angeles International Airport","Los Angeles","United States"],["SFO","San Francisco International Airport","San Francisco","United States"],["ORD","O'Hare International Airport","Chicago","United States"],["LHR","Heathrow Airport","London","United Kingdom"],["LGW","Gatwick Airport","London","United Kingdom"],["CDG","Charles de Gaulle Airport","Paris","France"],["DXB","Dubai International Airport","Dubai","United Arab Emirates"],["DOH","Hamad International Airport","Doha","Qatar"],["SIN","Changi Airport","Singapore","Singapore"],["SYD","Sydney Airport","Sydney","Australia"],["MEL","Melbourne Airport","Melbourne","Australia"],["BKK","Suvarnabhumi Airport","Bangkok","Thailand"],["HND","Haneda Airport","Tokyo","Japan"],["NRT","Narita International Airport","Tokyo","Japan"],["PEK","Beijing Capital International Airport","Beijing","China"],["YYZ","Toronto Pearson International Airport","Toronto","Canada"],["FRA","Frankfurt Airport","Frankfurt","Germany"],["AMS","Amsterdam Airport Schiphol","Amsterdam","Netherlands"],["IST","Istanbul Airport","Istanbul","Türkiye"],["JNB","O. R. Tambo International Airport","Johannesburg","South Africa"],["GRU","São Paulo/Guarulhos International Airport","São Paulo","Brazil"]
].map(x=>({code:x[0],name:x[1],city:x[2],country:x[3]}));

function normalize(data){
return Object.values(data).filter(a=>a.iata&&a.name&&a.city&&a.country).map(a=>({code:a.iata,name:a.name,city:a.city,country:a.country})).filter((a,i,self)=>self.findIndex(x=>x.code===a.code)===i).sort((a,b)=>(a.city+a.name).localeCompare(b.city+b.name));
}
async function loadAirports(){
try{
let r=await fetch("https://raw.githubusercontent.com/mwgg/Airports/master/airports.json",{cache:"force-cache"});
if(!r.ok)throw Error();
let d=normalize(await r.json()); if(d.length<1000)throw Error();
airports=d;$("status").textContent="Worldwide airports loaded: "+airports.length.toLocaleString()+"+ airports.";
}catch(e){
airports=fallback;$("status").textContent="Airport database loaded in offline fallback mode. Add the worldwide airports JSON locally for fully offline operation.";
}}
function matches(q){
q=q.trim().toLowerCase(); if(!q)return airports.slice(0,25);
return airports.filter(a=>(a.code+" "+a.name+" "+a.city+" "+a.country).toLowerCase().includes(q)).slice(0,40);
}
function showSug(input,box,isFrom){
const list=matches(input.value); box.innerHTML="";
if(!list.length){box.innerHTML='<div class="sug">No airport found</div>';box.hidden=false;return;}
list.forEach(a=>{
let b=document.createElement("button");b.type="button";b.className="sug";
b.innerHTML="<b>"+a.code+"</b> — "+escapeHtml(a.name)+"<small>"+escapeHtml(a.city)+", "+escapeHtml(a.country)+"</small>";
b.onclick=()=>{if(isFrom){fromAirport=a;selectedFrom=true}else{toAirport=a;selectedTo=true} input.value=a.code+" — "+a.name+" ("+a.city+")";box.hidden=true;};
box.appendChild(b);
});box.hidden=false;
}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
$("fromInput").addEventListener("focus",e=>showSug(e.target,$("fromSug"),true));
$("fromInput").addEventListener("input",e=>{selectedFrom=false;fromAirport=null;showSug(e.target,$("fromSug"),true)});
$("toInput").addEventListener("focus",e=>showSug(e.target,$("toSug"),false));
$("toInput").addEventListener("input",e=>{selectedTo=false;toAirport=null;showSug(e.target,$("toSug"),false)});
document.addEventListener("click",e=>{if(!e.target.closest("#fromInput")&&!e.target.closest("#fromSug"))$("fromSug").hidden=true;if(!e.target.closest("#toInput")&&!e.target.closest("#toSug"))$("toSug").hidden=true;});
document.querySelectorAll('input[name="trip"]').forEach(x=>x.onchange=()=>{$("returnWrap").style.display=x.value==="oneway"?"none":"block"});

function qs(site, f){
const d=f.depart, r=f.returnDate, p=f.passengers;
if(site==="Google Flights") return "https://www.google.com/travel/flights?hl=en&curr=INR#flt="+f.from+"."+f.to+"."+d+(r?"*"+f.to+"."+f.from+"."+r:"");
if(site==="Skyscanner") return "https://www.skyscanner.co.in/transport/flights/"+f.from.toLowerCase()+"/"+f.to.toLowerCase()+"/"+d.slice(0,4)+d.slice(5,7)+d.slice(8,10)+"/";
if(site==="KAYAK") return "https://www.kayak.co.in/flights/"+f.from+"-"+f.to+"/"+d+(r?"-flexible/"+r:"")+"?sort=bestflight_a";
if(site==="Wego") return "https://www.wego.co.in/flights/search?search="+f.from+"-"+f.to+"-"+d;
if(site==="Expedia") return "https://www.expedia.co.in/Flights-Search?flight-type="+(f.trip==="oneway"?"on":"roundtrip")+"&from="+f.from+"&to="+f.to+"&departure="+d+(r?"&return="+r:"")+"&passengers="+p;
return "https://www.kiwi.com/en/search/results/"+f.from+"/"+f.to+"/"+d+"/"+(r||d)+"/";
}
const sites=["Google Flights","Skyscanner","KAYAK","Wego","Expedia","Kiwi.com"];

$("searchForm").onsubmit=e=>{
e.preventDefault();
if(!selectedFrom||!selectedTo)return alert("Please select From and To from the airport search results.");
const trip=document.querySelector('input[name="trip"]:checked').value, depart=$("depart").value, ret=$("return").value;
if(!depart)return alert("Please select departure date.");
if(trip!=="oneway"&&!ret)return alert("Please select return date.");
if(fromAirport.code===toAirport.code)return alert("From and To cannot be the same.");
const f={from:fromAirport.code,to:toAirport.code,depart,returnDate:ret,passengers:$("passengers").value,trip};
let cards=sites.map(s=>'<a class="site" target="_blank" rel="noopener" href="'+qs(s,f)+'"><div><b>'+s+'</b><span>Open exact route search ↗</span></div><div class="go">Search</div></a>').join("");
$("results").innerHTML='<div class="compare"><h2>💰 Compare flight websites</h2><div class="muted">'+fromAirport.city+' ('+fromAirport.code+') → '+toAirport.city+' ('+toAirport.code+') · '+depart+(ret?" → "+ret:"")+'</div><div class="sites">'+cards+'</div><div class="muted" style="margin-top:14px">Prices shown by these websites are live on their own platforms. This page does not invent or display fake prices.</div></div><div class="compare"><h2>✈️ Flight results</h2><div class="empty">For live fares, choose a comparison website above. A real-time flight API is required to display live fares directly inside Smart Scanner.</div></div>';
window.scrollTo({top:$("results").offsetTop-70,behavior:"smooth"});
};
loadAirports();
})();
</script>
</body>
</html>
